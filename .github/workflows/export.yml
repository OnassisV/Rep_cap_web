name: Exportar a Drive
on:
  schedule:
    # Hora Peru (UTC-5): cada hora de 7:30 a 19:30
    - cron: "30 12-23 * * *"   # 7:30 a 18:30 Peru
    - cron: "30 0 * * *"       # 19:30 Peru
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas sqlalchemy pymysql google-api-python-client google-auth
      - run: python scripts/exportar_a_drive.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          TABLAS: ${{ secrets.TABLAS }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
