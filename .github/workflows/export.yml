name: Exportar a Drive
on:
  schedule:
    # 7:45 y 15:45 hora Peru (UTC-5), despues de la sincronizacion de :15
    - cron: "45 12,20 * * *"
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas sqlalchemy pymysql google-api-python-client google-auth
      - run: python scripts/exportar_a_drive.py
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID_exportpbi }}
          TABLAS: ${{ secrets.TABLAS_export_pbi }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON_EXPORT_PBI }}
