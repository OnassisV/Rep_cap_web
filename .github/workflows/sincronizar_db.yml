name: Sincronización Automática DIFOCA -> Railway

on:
  schedule:
    # Se ejecuta al minuto 15 de cada hora entre las 12:15 UTC y las 00:15 UTC
    # (07:15 AM a 07:15 PM Hora de Perú UTC-5)
    - cron: '15 12-23,0 * * *'

  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          python -m pip install --upgrade pip
          pip install mysql-connector-python

      - name: Descargar Backups Recientes de Google Drive
        env:
          RCLONE_CONFIG_NUBE: ${{ secrets.RCLONE_CONFIG_NUBE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_NUBE" > ~/.config/rclone/rclone.conf
          mkdir -p backups_temp
          # Descarga los archivos de respaldo desde la carpeta de Google Drive
          rclone copy nube:"WORK/2026/Minedu" ./backups_temp --include "DB_*" --include "aula_*"
          echo "--- Archivos descargados ---"
          ls -la backups_temp/

      - name: Ejecutar Script de Sincronización
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          SYNC_CONNECT_ATTEMPTS: "10"
          SYNC_CONNECT_DELAY_SECONDS: "5"
        run: |
          AULA_FILE=$(find backups_temp -type f \( -name "aula_*" -o -name "*aula*" \) | head -n 1)
          SIDI_FILE=$(find backups_temp -type f \( -name "DB_*" -o -name "*sidi*" -o -name "*SIDI*" \) | head -n 1)

          if [ -z "$AULA_FILE" ] || [ -z "$SIDI_FILE" ]; then
            echo "[ERROR] No se encontraron archivos de respaldo válidos en backups_temp."
            exit 1
          fi

          echo "Utilizando AULA_FILE: $AULA_FILE"
          echo "Utilizando SIDI_FILE: $SIDI_FILE"

          python sincronizar_mysql_a_railway.py --aula-sql "$AULA_FILE" --sidi-sql "$SIDI_FILE"