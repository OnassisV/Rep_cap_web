name: Sincronización Automática DIFOCA -> Railway

on:
  schedule:
    # 1. Corre desde las 07:15 hasta las 18:15 hora Perú (12:15 a 23:15 UTC)
    - cron: '15 12-23 * * *'
    
    # 2. Corre a las 19:15 hora Perú (00:15 UTC del día siguiente)
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      aula_course_filter:
        description: 'Backfill puntual: filtro de curso (ej: 338 o 305,311,315+). Vacio = corrida normal.'
        required: false
        default: ''

# Define la zona horaria de Perú para todo el workflow
env:
  TZ: 'America/Lima'

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          python -m pip install --upgrade pip
          pip install mysql-connector-python python-dotenv

      - name: Descargar Backups Recientes de Google Drive
        env:
          RCLONE_CONFIG_NUBE: ${{ secrets.RCLONE_CONFIG_NUBE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_NUBE" > ~/.config/rclone/rclone.conf
          mkdir -p backups_temp
          rclone copy nube:"WORK/BackUp EduReg" ./backups_temp --include "*.sql" --include "*edutalentos*" --include "*sidifoca*"
          echo "--- Archivos descargados ---"
          ls -la backups_temp/

      - name: Ejecutar Script de Sincronización
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          MYSQLHOST: ${{ secrets.MYSQLHOST }}
          MYSQLPORT: ${{ secrets.MYSQLPORT }}
          MYSQLUSER: ${{ secrets.MYSQLUSER }}
          MYSQLPASSWORD: ${{ secrets.MYSQLPASSWORD }}
          MYSQLDATABASE: ${{ secrets.MYSQLDATABASE }}
          SYNC_CONNECT_ATTEMPTS: "10"
          SYNC_CONNECT_DELAY_SECONDS: "5"
          SYNC_INCLUDE_SURVEY_ANSWER: "true"
          SYNC_INCLUDE_SURVEYS: "true"
          SYNC_INCLUDE_STUDENT_PUBLICATION: "true"
          SYNC_TABLE_C_SURVEY_ANSWER_FRACTION: "1.0"
          SYNC_SMALL_TABLE_FRACTION: "1.0"
          SYNC_MEDIUM_TABLE_FRACTION: "1.0"
          SYNC_LARGE_TABLE_FRACTION: "1.0"
          SYNC_AULA_COURSE_FILTER: ${{ github.event.inputs.aula_course_filter }}
        run: |
          # 1. Detectar las rutas reales de los archivos SQL descargados
          AULA_PATH=$(find backups_temp -type f \( -name "*aula*" -o -name "*edutalentos*" \) | head -n 1)
          SIDI_PATH=$(find backups_temp -type f \( -name "*sidi*" -o -name "*DB_*" -o -name "*db_*" \) | head -n 1)

          if [ -z "$AULA_PATH" ] || [ -z "$SIDI_PATH" ]; then
            echo "[ERROR] No se encontraron los respaldos requeridos en backups_temp."
            exit 1
          fi

          # 2. Asignar las variables de entorno que lee tu script de Python
          export AULA_SQL_PATH="$AULA_PATH"
          export SIDI_SQL_PATH="$SIDI_PATH"

          echo "AULA_SQL_PATH: $AULA_SQL_PATH"
          echo "SIDI_SQL_PATH: $SIDI_SQL_PATH"

          # 3. Ejecutar tu script original intacto
          python sincronizar_mysql_a_railway.py