name: Sincronización Automática DIFOCA -> Railway

on:
  schedule:
    - cron: '15 12-23,0 * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          python -m pip install --upgrade pip
          pip install mysql-connector-python python-dotenv

      - name: Descargar Backups Recientes de Google Drive
        env:
          RCLONE_CONFIG_NUBE: ${{ secrets.RCLONE_CONFIG_NUBE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_NUBE" > ~/.config/rclone/rclone.conf
          mkdir -p backups_temp
          rclone copy nube:"WORK/BackUp EduReg" ./backups_temp --include "*.sql" --include "*edutalentos*" --include "*sidifoca*"
          echo "--- Archivos descargados ---"
          ls -la backups_temp/

      - name: Preparar Archivos para el Script Python Original
        run: |
          AULA_FILE=$(find backups_temp -type f \( -name "*aula*" -o -name "*edutalentos*" \) | head -n 1)
          SIDI_FILE=$(find backups_temp -type f \( -name "*sidi*" -o -name "*DB_*" -o -name "*db_*" \) | head -n 1)

          if [ -z "$AULA_FILE" ] || [ -z "$SIDI_FILE" ]; then
            echo "[ERROR] No se encontraron los respaldos requeridos en backups_temp."
            exit 1
          fi

          # Crear la ruta esperada por defecto por tu script original
          TARGET_DIR="../../descargar tablas aula y sysdifo/operacion_backup_sql"
          mkdir -p "$TARGET_DIR"

          cp "$AULA_FILE" "$TARGET_DIR/edutalentos_aulavirtual.sql"
          cp "$SIDI_FILE" "$TARGET_DIR/db_sidifoca.sql"

          echo "[OK] Archivos mapeados en $TARGET_DIR"

      - name: Ejecutar Script de Sincronización Original
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          SYNC_CONNECT_ATTEMPTS: "10"
          SYNC_CONNECT_DELAY_SECONDS: "5"
        run: |
          # Se ejecuta tu script original de 1000+ líneas tal como está
          python sincronizar_mysql_a_railway.py