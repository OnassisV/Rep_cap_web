{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caso DNI {{ caso.dni_participante }} | CAP DIFOCA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <style>
        .portal-shell { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
        .portal-topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
            justify-content: space-between; margin-bottom: 22px; }
        .portal-back { color: #244062; font-weight: 600; text-decoration: none; font-size: .9rem; }
        .portal-back:hover { text-decoration: underline; }
        .portal-msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: .9rem; }
        .portal-msg--error { background: #fdecea; color: #8a1c13; }
        .portal-msg--info { background: #eaf1fb; color: #1a3a63; }
        .caso-panel { border: 1px solid rgba(36,64,98,.15); border-radius: 14px; padding: 22px 24px;
            background: rgba(255,255,255,.75); }
    </style>
</head>
<body>
    <div class="scene-grid"></div>

    <main class="portal-shell">
        <div class="portal-topbar">
            <a class="portal-back" href="{% url 'core:portal_casos' caso.capacitacion_id %}">← Volver a mis casos</a>
            <form method="post" action="{% url 'accounts:logout' %}" style="display:inline">
                {% csrf_token %}
                <button type="submit" class="logout-link">Cerrar sesion</button>
            </form>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="portal-msg portal-msg--{% if message.tags == 'error' %}error{% else %}info{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <section class="caso-panel">
            {% include "core/_caso_hilo.html" %}
        </section>
    </main>
</body>
</html>
